[package]
name = "engine-api"
description = "Wrought `api` feature: JSON API for content types with scoped, revocable tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
roles = ["engine-auth/roles"]

[dependencies]
engine-core = { workspace = true, features = ["api"] }
engine-db.workspace = true
engine-content.workspace = true
engine-auth.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["json", "query"] }
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
