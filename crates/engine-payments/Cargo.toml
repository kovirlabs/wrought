[package]
name = "engine-payments"
description = "Wrought payments: checkout through a pluggable provider (Stripe, and a fake one for tests), signed webhooks, orders with a state machine, a server-side cart and the Commerce components"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# The spec's `payments` feature needs `auth` and `jobs`; `jobs` needs
# PostgreSQL, so payments does too.
default = ["postgres"]
postgres = ["engine-db/postgres", "engine-auth/postgres", "engine-jobs/postgres", "sqlx/postgres"]

[dependencies]
engine-core = { workspace = true, features = ["auth"] }
engine-db.workspace = true
engine-auth.workspace = true
engine-jobs.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["form", "query", "json"] }
hmac = "0.12"
include_dir.workspace = true
minijinja.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
