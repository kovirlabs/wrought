label = "Checkout summary"
version = "1.0.0"
group = "commerce"
features = ["payments"]
description = "What will be paid for and the button that starts the payment, with an idempotency key."
reads = ["user", "csrf", "request"]

[[args]]
name = "cart"
type = "object"
help = "Default: shop_cart()."

[[args]]
name = "title"
type = "text"
default = "Checkout"

[[args]]
name = "level"
type = "integer"
default = 2

[[args]]
name = "label"
type = "text"
help = "Button text; default \"Pay <total>\"."

[[args]]
name = "next"
type = "url"

[editor]
icon = "checkout"

[example]
cart = { signed_in = true, empty = false, count = 3, total = 4850, total_display = "£48.50", currency = "GBP", checkout_key = "example-key", lines = [ { product = "enamel-mug", name = "Enamel mug", quantity = 2, amount = 2900, amount_display = "£29.00", available = true }, { product = "forged-trivet", name = "Forged trivet", quantity = 1, amount = 1950, amount_display = "£19.50", available = true } ] }
