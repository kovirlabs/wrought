label = "Order history"
version = "1.0.0"
group = "commerce"
features = ["payments"]
description = "The signed-in visitor's orders, newest first, with a status report on the order just paid."
reads = ["user", "request"]

[[args]]
name = "orders"
type = "list"
help = "Default: shop_orders(limit=limit)."

[[args]]
name = "limit"
type = "integer"
default = 20

[[args]]
name = "title"
type = "text"
default = "Your orders"

[[args]]
name = "level"
type = "integer"
default = 2

[[args]]
name = "order"
type = "text"
help = "An order to report on; default request.args.order."

[editor]
icon = "orders"

[example]
order = "ord_example1"
orders = [
  { public_id = "ord_example1", status = "paid", total = 4850, total_display = "£48.50", created_at = "2026-11-26T10:00:00Z", lines = [ { quantity = 2, name = "Enamel mug" }, { quantity = 1, name = "Forged trivet" } ] },
  { public_id = "ord_example0", status = "refunded", total = 1950, total_display = "£19.50", created_at = "2026-11-20T09:00:00Z", lines = [ { quantity = 1, name = "Forged trivet" } ] },
]
