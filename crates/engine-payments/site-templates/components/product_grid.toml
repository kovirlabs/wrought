label = "Product grid"
version = "1.0.0"
group = "commerce"
features = ["payments"]
description = "A list of product cards, with a status message after an add-to-cart."
reads = ["user", "csrf", "request"]

[[args]]
name = "products"
type = "list"
help = "Default: shop_products(limit=limit)."

[[args]]
name = "limit"
type = "integer"

[[args]]
name = "title"
type = "text"

[[args]]
name = "level"
type = "integer"
default = 2

[[args]]
name = "next"
type = "url"

[editor]
icon = "grid"

[example]
title = "From the forge"
products = [
  { id = "enamel-mug", name = "Enamel mug", summary = "Hand-dipped, with a forged handle.", price = 1450, currency = "GBP", price_display = "£14.50", available = true },
  { id = "forged-trivet", name = "Forged trivet", summary = "Scrolled mild steel, oiled.", price = 1950, currency = "GBP", price_display = "£19.50", available = true },
]
