label = "Cart"
version = "1.0.0"
group = "commerce"
features = ["payments"]
description = "The signed-in visitor's cart as a table, with a form per line to change the quantity or remove it."
reads = ["user", "csrf", "request"]

[[args]]
name = "cart"
type = "object"
help = "Default: shop_cart()."

[[args]]
name = "title"
type = "text"
default = "Your cart"

[[args]]
name = "level"
type = "integer"
default = 2

[[args]]
name = "next"
type = "url"

[editor]
icon = "cart"

[example]
cart = { signed_in = true, empty = false, count = 3, total = 4850, total_display = "£48.50", currency = "GBP", lines = [ { product = "enamel-mug", name = "Enamel mug", quantity = 2, unit_amount = 1450, unit_display = "£14.50", amount = 2900, amount_display = "£29.00", available = true }, { product = "forged-trivet", name = "Forged trivet", quantity = 1, unit_amount = 1950, unit_display = "£19.50", amount = 1950, amount_display = "£19.50", available = true } ] }
