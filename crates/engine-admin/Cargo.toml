[package]
name = "engine-admin"
description = "Wrought admin: server-rendered admin UI (minijinja + htmx) for content, taxonomy, revisions, users and roles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["postgres"]
postgres = ["engine-db/postgres", "engine-content/postgres", "engine-auth/postgres", "engine-forms?/postgres", "engine-media?/postgres", "engine-jobs?/postgres", "engine-api?/postgres", "engine-payments?/postgres", "sqlx/postgres"]
sqlite = ["engine-db/sqlite", "engine-content/sqlite", "engine-auth/sqlite", "engine-forms?/sqlite", "engine-media?/sqlite", "engine-api?/sqlite", "sqlx/sqlite"]
roles = ["engine-auth/roles"]
# Draft -> review -> published, preview, notifications.
workflow = ["engine-core/workflow"]
# Forms and submissions screens (engine-cli enables this when both `admin`
# and `forms` are on).
forms = ["dep:engine-forms"]
media = ["dep:engine-media"]
api = ["dep:engine-api"]
jobs = ["dep:engine-jobs"]
# The orders screen (Postgres sites with `payments`).
payments = ["dep:engine-payments", "jobs"]

[dependencies]
engine-core = { workspace = true, features = ["admin"] }
engine-db.workspace = true
engine-content.workspace = true
engine-auth.workspace = true
engine-forms = { workspace = true, optional = true }
engine-media = { workspace = true, optional = true }
engine-api = { workspace = true, optional = true }
engine-jobs = { workspace = true, optional = true }
engine-payments = { workspace = true, optional = true }
anyhow.workspace = true
axum = { workspace = true, features = ["form", "query", "multipart"] }
include_dir.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
