[package]
name = "engine-admin"
description = "Wrought admin: server-rendered admin UI (minijinja + htmx) for content, taxonomy, revisions, users and roles"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["postgres"]
postgres = ["engine-db/postgres", "engine-content/postgres", "engine-auth/postgres"]
roles = ["engine-auth/roles"]

[dependencies]
engine-core = { workspace = true, features = ["admin"] }
engine-db.workspace = true
engine-content.workspace = true
engine-auth.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["form", "query"] }
include_dir.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
