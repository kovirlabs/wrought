[package]
name = "engine-realtime"
description = "Hammerwright `realtime` feature: live regions over server-sent events, fed by the PostgreSQL change feed (LISTEN/NOTIFY), with the live_region component"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
engine-core = { workspace = true, features = ["realtime"] }
engine-db.workspace = true
anyhow.workspace = true
axum.workspace = true
# The `Stream` trait of the event stream's body (already in the build
# through axum).
futures-core = "0.3"
include_dir.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
