[package]
name = "engine-db"
description = "Wrought data layer: PostgreSQL and SQLite pools, backend-neutral queries, migrations"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# At least one backend must be on; both may be (the URL picks one).
default = ["postgres"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-webpki"]
sqlite = ["sqlx/sqlite"]

[dependencies]
engine-core.workspace = true
anyhow.workspace = true
serde.workspace = true
sha2.workspace = true
chrono = { workspace = true }
serde_json.workspace = true
sqlx = { workspace = true, features = ["chrono"] }
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
