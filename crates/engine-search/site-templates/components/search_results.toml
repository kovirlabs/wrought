label = "Search results"
version = "1.0.0"
group = "listings"
features = ["search"]
description = "Results for ?q= with highlighted extracts and page links."
reads = ["request"]

[[args]]
name = "q"
type = "text"
help = "Default: the request's q."

[[args]]
name = "type"
type = "text"

[[args]]
name = "per_page"
type = "integer"
default = 10

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "results"

[example]
q = "iron"
level = 3
