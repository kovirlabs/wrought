{#- The published `__name__` items (generated by `engine generate type`). -#}
{% extends "__layout__" %}
{% block main %}
<h1>{{ page.title }}</h1>
<ul>
{% for item in list_items("__name__") %}
<li><a href="{{ item.url }}">{{ item.title }}</a></li>
{% else %}
<li>No __plural_label__ yet.</li>
{% endfor %}
</ul>
{% endblock %}
