[package]
name = "engine-cli"
description = "The `engine` command line for Hammerwright"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "engine"
path = "src/main.rs"

[features]
# Each spec feature switches on its crate plus engine-core's marker feature.
# Dependency chains (spec feature table): publish -> content -> the
# database; admin -> auth + content; roles -> auth; workflow -> admin;
# jobs -> the database; mail -> jobs. The database is PostgreSQL, the only
# one (`db-postgres`); `content`, `auth`, `forms`, `media` and `jobs` switch
# it on themselves, and the default (static) build has none of it.
default = ["static"]
static = ["engine-core/static"]
db-postgres = ["dep:engine-db", "engine-core/db-postgres"]
content = ["db-postgres", "dep:engine-content", "engine-core/content"]
publish = ["content", "dep:engine-publish", "engine-core/publish"]
# The `request` render mode: per-request pages with the fragment cache.
# Switched on by the features that need it (auth, forms).
request = ["engine-core/request"]
auth = ["db-postgres", "dep:engine-auth", "engine-core/auth", "request", "engine-mail?/auth"]
roles = ["auth", "engine-auth/roles", "engine-core/roles", "engine-admin?/roles", "engine-api?/roles"]
admin = ["auth", "content", "dep:engine-admin", "engine-core/admin"]
workflow = ["admin", "engine-admin/workflow", "engine-core/workflow"]
# With `admin` too, the admin gets its forms screens (`engine-admin?/forms`
# only applies when the admin is compiled in).
forms = ["db-postgres", "dep:engine-forms", "engine-core/forms", "request", "engine-admin?/forms"]
jobs = ["db-postgres", "dep:engine-jobs", "engine-core/jobs", "engine-admin?/jobs"]
mail = ["jobs", "dep:engine-mail", "engine-core/mail"]
# Uploads and image variants; needs the database like `content`.
media = ["db-postgres", "dep:engine-media", "engine-core/media", "engine-admin?/media", "engine-forms?/media"]
# Full-text search of content (PostgreSQL tsvector).
search = ["content", "dep:engine-search", "engine-core/search"]
# JSON API for content types, with tokens (needs accounts and content).
api = ["auth", "content", "dep:engine-api", "engine-core/api", "engine-admin?/api"]
# Single sign-on through OpenID Connect providers (needs accounts). Not in a
# preset: it adds an HTTP client and is only useful with a provider.
oidc = ["auth", "engine-auth/oidc", "engine-core/oidc"]
# `[publish] target = "s3"`: pages (and public media) in an S3-compatible
# bucket behind a CDN, with invalidation of the changed paths. Needs no
# database: a static site built with `--features s3` uploads from
# `engine build`.
s3 = ["dep:engine-s3", "engine-core/s3"]
# Checkout, webhooks, orders and the Commerce components. Needs `auth` and
# `jobs` (spec). In no preset: a shop is a deliberate choice.
payments = ["auth", "jobs", "dep:engine-payments", "engine-core/payments", "engine-admin?/payments"]
# The visual editor: a block editor in the admin with a live preview
# rendered by the engine (spec: needs `admin` and `content`). Its bundle is
# built from editor/ and committed (scripts/build-editor.sh); building the
# engine never needs Node.
visual-editor = ["admin", "engine-admin/visual-editor", "engine-core/visual-editor"]
# Presets. `cms` is the spec's cms preset (content, publish, admin,
# workflow, media) plus roles so several editors can have different
# rights, search, the visual editor and `s3` (the Ingotyard bucket option),
# on PostgreSQL. `app` is cms plus forms, jobs, mail and the JSON API.
cms = ["static", "db-postgres", "content", "publish", "auth", "roles", "admin", "workflow", "media", "search", "s3", "visual-editor", "engine-core/cms"]
app = ["cms", "forms", "jobs", "mail", "api", "engine-core/app"]

[dependencies]
engine-core.workspace = true
engine-db = { workspace = true, optional = true }
engine-content = { workspace = true, optional = true }
engine-publish = { workspace = true, optional = true }
engine-auth = { workspace = true, optional = true }
engine-admin = { workspace = true, optional = true }
engine-forms = { workspace = true, optional = true }
engine-jobs = { workspace = true, optional = true }
engine-mail = { workspace = true, optional = true }
engine-media = { workspace = true, optional = true }
engine-search = { workspace = true, optional = true }
engine-api = { workspace = true, optional = true }
engine-s3 = { workspace = true, optional = true }
engine-payments = { workspace = true, optional = true }
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
include_dir.workspace = true
minijinja.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The bucket end-to-end test (tests/s3.rs) reads the bucket with it.
engine-s3.workspace = true
