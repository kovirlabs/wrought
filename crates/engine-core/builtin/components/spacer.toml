label = "Spacer"
version = "1.0.0"
group = "layout"
features = ["core"]
description = "Empty vertical space, a multiple of the spacing token; hidden from assistive technology."
style = "layout"

[[args]]
name = "size"
type = "select"
options = ["xs", "sm", "md", "lg", "xl"]
default = "md"

[editor]
icon = "spacer"

[example]
size = "lg"
