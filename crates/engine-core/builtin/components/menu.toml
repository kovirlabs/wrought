label = "Menu"
version = "1.0.0"
group = "navigation"
features = ["core"]
description = "A <nav> list of links with optional dropdown disclosures and the current page marked."
reads = ["site", "page"]

[[args]]
name = "items"
type = "list"
help = "Default: [site] nav."
[[args.fields]]
name = "label"
type = "text"
required = true

[[args.fields]]
name = "url"
type = "url"

[[args.fields]]
name = "children"
type = "list"
help = "Links under this one: [{label, url}]. The item becomes a disclosure (a dropdown in the header)."

[[args]]
name = "label"
type = "text"
default = "Main"
help = "Accessible name of the nav; give each nav on a page its own."

[[args]]
name = "current"
type = "url"
help = "URL to mark as current; default this page."

[editor]
icon = "menu"

[example]
label = "Example menu"
current = "/components/"
items = [
  { label = "Docs", url = "/docs/" },
  { label = "Components", url = "/components/" },
  { label = "More", children = [ { label = "Templates", url = "/docs/templates/" }, { label = "Styling", url = "/docs/styling/" } ] },
]
