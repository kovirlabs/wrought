label = "Stack"
version = "1.0.0"
group = "layout"
features = ["core"]
description = "Blocks one above the other with an even gap from the spacing token."
style = "layout"

[[args]]
name = "items"
type = "list"
items = "html"
required = true

[[args]]
name = "gap"
type = "select"
options = ["xs", "sm", "md", "lg", "xl"]
default = "md"

[editor]
icon = "stack"
slots = ["items"]

[example]
gap = "sm"
items = ["<p>First block.</p>", "<p>Second block, a small gap below the first.</p>"]
