label = "Tabs"
version = "1.0.0"
group = "navigation"
features = ["core"]
description = "Panels behind a row of tabs (ARIA tabs pattern, switched by TagAction); every panel shows without JavaScript."

[[args]]
name = "items"
type = "list"
required = true

[[args.fields]]
name = "label"
type = "text"
required = true

[[args.fields]]
name = "body"
type = "html"

[[args.fields]]
name = "markdown"
type = "markdown"

[[args.fields]]
name = "text"
type = "text"

[[args]]
name = "label"
type = "text"
required = true
help = "Accessible name of the tab list."

[[args]]
name = "id"
type = "text"
default = "tabs"
help = "Prefix of the tab and panel ids; unique on the page."

[[args]]
name = "selected"
type = "integer"
default = 1

[editor]
icon = "tabs"
slots = ["items"]

[example]
id = "example-tabs"
label = "Install with"
items = [
  { label = "Cargo", markdown = "Build the engine with `cargo build --release`." },
  { label = "Binary", text = "Download a release binary and put it on your PATH." },
]
