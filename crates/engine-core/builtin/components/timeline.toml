label = "Timeline"
version = "1.0.0"
group = "content"
features = ["core"]
description = "Events in order with optional dates, as a numbered list of steps."

[[args]]
name = "items"
type = "list"
required = true

[[args.fields]]
name = "title"
type = "text"
required = true

[[args.fields]]
name = "date"
type = "date"

[[args.fields]]
name = "text"
type = "text"

[[args.fields]]
name = "href"
type = "url"

[[args]]
name = "title"
type = "text"

[[args]]
name = "level"
type = "integer"
default = 3

[editor]
icon = "timeline"

[example]
title = "Milestones"
level = 4
items = [
  { title = "v0.1 static", date = "2026-11-20", text = "Build mode, templates, Markdown." },
  { title = "v0.5 polish", date = "2026-11-26", text = "Media, search, the JSON API." },
]
