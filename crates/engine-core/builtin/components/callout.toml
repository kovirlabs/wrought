label = "Callout"
version = "1.0.0"
group = "content"
features = ["core"]
description = "A highlighted aside inside an article, coloured by tone."

[[args]]
name = "title"
type = "text"

[[args]]
name = "text"
type = "text"

[[args]]
name = "tone"
type = "select"
options = ["info", "success", "warning", "error", "neutral"]

[editor]
icon = "callout"

[example]
title = "Heads up"
text = "Callouts are an aside inside an article; tone colours them."
tone = "warning"
