label = "Page list"
version = "1.0.0"
group = "content"
features = ["core"]
description = "Pages as a grid of cards with date and summary."

[[args]]
name = "pages"
type = "list"
required = true

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "list"

[example]
level = 3
pages = [ { title = "Getting started", url = "/docs/getting-started/", date = "2026-11-20", description = "Install the engine and build a first site." }, { title = "Templates", url = "/docs/templates/", description = "Layouts and components." } ]
