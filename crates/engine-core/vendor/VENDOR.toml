# Not bundled: TagCheck is a Node.js tool. `engine check` and `engine dev`
# run it as an external program (see crates/engine-cli/src/check.rs).
[[external]]
name = "@kovirlabs/tagcheck"
role = "checks"
version = "0.1.3"
license = "Apache-2.0"
source = "https://github.com/kovirlabs/tagcheck"
npm_integrity = "sha512-TJt701ShMdy0GDU/X+Qh3U++UUc7yrEZWxRnaxHsepJp6hZP5S/NGboavcYIpJr5fsGbKUgPEMhtu6hs9WaGYg=="
notes = "Needs Node.js >= 20. Note: the unscoped npm package `tagcheck` is an unrelated project; always use @kovirlabs/tagcheck."
