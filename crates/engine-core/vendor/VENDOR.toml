npm_integrity = "sha512-nB85teLCBaO1s2zgd3PjNPaq8eZGnourZcnO8B5ZpXysKIA6Kty9mMuObDIgFEEJmOFOLFWN1pGZWCluoiu5Eg=="
sha256 = "dc6eb189a7d9baf66deaf9f1393770dea54a95a8d34fb9f067e6fb2a42fd4c93"
