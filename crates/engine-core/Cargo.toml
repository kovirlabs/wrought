[package]
name = "engine-core"
description = "Wrought core: config, routing, render modes, cache tags, templates, Markdown content, build mode and the built-in static server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# `core` is always compiled; it is not a Cargo feature. The features below are
# markers: they pull in no dependencies here, they only tell core which
# render modes and route kinds the binary supports (`features::compiled()`).
# The code for each lives in its own crate (engine-db, engine-content,
# engine-publish), enabled by the matching feature of engine-cli.
default = ["static"]
static = []
db-postgres = []
content = []
publish = ["content"]
# Preset: as much of the spec's `cms` (content, publish, admin, workflow,
# media) as exists so far, plus Postgres as its database.
cms = ["static", "db-postgres", "content", "publish"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
include_dir.workspace = true
minijinja.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
