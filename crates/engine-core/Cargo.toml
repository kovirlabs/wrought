[package]
name = "engine-core"
description = "Wrought core: config, routing, render modes, cache tags, templates, Markdown content, build mode and the built-in static server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# `core` is always compiled; it is not a Cargo feature. The features below are
# markers: they pull in no dependencies here, they only tell core which
# render modes and route kinds the binary supports (`features::compiled()`).
# The code for each lives in its own crate (engine-db, engine-content,
# engine-publish), enabled by the matching feature of engine-cli.
default = ["static"]
static = []
db-postgres = []
content = []
publish = ["content", "targets"]
# `request` render mode: pages rendered per request, fragments cached in
# memory (moka). Brings the HTTP helpers form posts need (`web`) and the App
# UI components. `auth` and `forms` switch it on.
request = ["dep:moka", "dep:getrandom", "dep:base64", "dep:subtle"]
auth = ["request"]
roles = ["auth"]
admin = ["auth", "content"]
workflow = ["admin"]
forms = ["request"]
jobs = ["db-postgres"]
mail = ["jobs"]
media = []
search = ["content"]
api = ["auth"]
# Single sign-on through OpenID Connect providers.
oidc = ["auth"]
# Publishing to an S3-compatible bucket with CDN invalidation (engine-s3).
# Works without `publish` too: a static site uploaded by `engine build`.
s3 = ["targets"]
# Not a marker: the `target` module (publish targets), for engine-publish
# and engine-s3.
targets = []
payments = ["auth", "jobs"]
# The block editor in the admin (engine-admin's `visual-editor`).
visual-editor = ["admin"]
# Presets. `cms`: the spec's cms (content, publish, admin, workflow, media)
# on PostgreSQL, plus `roles` so several editors can work with different
# rights (see DECISIONS.md). `app`: cms plus forms, jobs, mail and `api`.
cms = ["static", "db-postgres", "content", "publish", "auth", "roles", "admin", "workflow", "media", "search", "s3", "visual-editor"]
app = ["cms", "forms", "jobs", "mail", "api"]

[dependencies]
anyhow.workspace = true
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
moka = { version = "0.12", default-features = false, features = ["sync"], optional = true }
sha2.workspace = true
# Pre-compressed copies of published text files (`precompress`): written
# with Google's Brotli and libdeflate (C, faster than the Rust ports on small
# files, DECISIONS.md); read back (bucket targets) with the Rust decoders.
brotli = "8"
brotlic = "0.8.4"
flate2 = "1.1"
libdeflater = "1.26"
subtle = { version = "2", optional = true }
axum.workspace = true
include_dir.workspace = true
minijinja.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
toml.workspace = true

# Pinning build threads to CPUs on isolcpus hosts (ENGINE_BUILD_PIN_CPUS).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
