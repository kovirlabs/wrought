[package]
name = "engine-core"
description = "Wrought core: config, routing, render modes, cache tags, templates, Markdown content, build mode and the built-in static server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# `core` is always compiled; it is not a Cargo feature. The features below are
# markers: they pull in no dependencies here, they only tell core which
# render modes and route kinds the binary supports (`features::compiled()`).
# The code for each lives in its own crate (engine-db, engine-content,
# engine-publish), enabled by the matching feature of engine-cli.
default = ["static"]
static = []
db-postgres = []
db-sqlite = []
content = []
publish = ["content"]
# `request` render mode: pages rendered per request, fragments cached in
# memory (moka). Brings the HTTP helpers form posts need (`web`) and the App
# UI components. `auth` and `forms` switch it on.
request = ["dep:moka", "dep:getrandom", "dep:base64", "dep:sha2", "dep:subtle"]
auth = ["request"]
roles = ["auth"]
admin = ["auth", "content"]
workflow = ["admin"]
forms = ["request"]
jobs = ["db-postgres"]
mail = ["jobs"]
media = []
search = ["content"]
api = ["auth"]
# Presets. `cms`: as much of the spec's cms (content, publish, admin,
# workflow, media) as exists so far, plus Postgres as its database, and
# `roles` so several editors can work with different rights (see
# DECISIONS.md). `app`: cms plus forms, jobs and mail (`api` joins in v0.5).
cms = ["static", "db-postgres", "db-sqlite", "content", "publish", "auth", "roles", "admin", "workflow", "media", "search"]
app = ["cms", "forms", "jobs", "mail", "api"]

[dependencies]
anyhow.workspace = true
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
moka = { version = "0.12", default-features = false, features = ["sync"], optional = true }
sha2 = { workspace = true, optional = true }
subtle = { version = "2", optional = true }
axum.workspace = true
include_dir.workspace = true
minijinja.workspace = true
percent-encoding.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true

# Pinning build threads to CPUs on isolcpus hosts (ENGINE_BUILD_PIN_CPUS).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
