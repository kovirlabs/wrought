label = "Stat card"
version = "1.0.0"
group = "app"
features = ["request"]
description = "A label and a number, with an optional change."

[[args]]
name = "label"
type = "text"
required = true

[[args]]
name = "value"
type = "any"
required = true

[[args]]
name = "unit"
type = "text"

[[args]]
name = "delta"
type = "text"

[[args]]
name = "trend"
type = "select"
options = ["up", "down"]

[[args]]
name = "href"
type = "url"

[[args]]
name = "level"
type = "integer"
default = 3

[editor]
icon = "stat"

[example]
label = "Orders"
value = 1148
delta = "+12% this week"
trend = "up"
