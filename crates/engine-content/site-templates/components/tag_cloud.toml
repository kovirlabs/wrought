label = "Tag cloud"
version = "1.0.0"
group = "listings"
features = ["content"]
description = "The terms of a vocabulary with their counts, weighted 1 to 5."

[[args]]
name = "vocabulary"
type = "text"
required = true

[[args]]
name = "heading"
type = "text"

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "tags"

[example]
vocabulary = "topics"
heading = "Topics"
level = 3
