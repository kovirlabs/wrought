label = "Multi-step form"
version = "1.0.0"
group = "forms"
features = ["forms"]
description = "A form with [[steps]], one step per page, everything checked again on the last."
reads = ["csrf", "request", "form_state"]

[[args]]
name = "name"
type = "text"
required = true

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "steps"

[example]
name = "survey"
level = 3
