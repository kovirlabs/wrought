label = "Contact form"
version = "1.0.0"
group = "forms"
features = ["forms"]
description = "Name, email and message (forms/contact.toml or the built-in one)."
reads = ["csrf", "request", "form_state"]

[[args]]
name = "name"
type = "text"
default = "contact"

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "mail"

[example]
level = 3
