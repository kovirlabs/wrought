label = "Form"
version = "1.0.0"
group = "forms"
features = ["forms"]
description = "Any form from forms/<name>.toml or the admin, validated on the server, with a spam guard."
reads = ["csrf", "request", "form_state"]

[[args]]
name = "name"
type = "text"
required = true

[[args]]
name = "level"
type = "integer"
default = 2

[[args]]
name = "heading"
type = "boolean"
default = true

[editor]
icon = "form"

[example]
name = "feedback"
level = 3
