label = "File upload"
version = "1.0.0"
group = "forms"
features = ["forms", "media"]
description = "A form with file fields (pictures, PDFs), stored privately; TagAction lists chosen files and takes drag and drop."
reads = ["csrf", "request", "form_state"]

[[args]]
name = "name"
type = "text"
default = "upload"

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "upload"

[example]
level = 3
