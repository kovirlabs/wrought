# Built-in newsletter signup, behind the `newsletter_signup` component. Each
# address is stored once. A site's own forms/newsletter.toml replaces it.
title = "Newsletter"
submit = "Subscribe"
success = "Thank you for subscribing."
unique = "email"

[[fields]]
name = "email"
label = "Email address"
type = "email"
required = true
autocomplete = "email"

[[fields]]
name = "consent"
label = "Send me the newsletter. I can unsubscribe at any time."
type = "checkbox"
required = true
