{#- Built-in HTML layout for engine mail. Override with templates/mail/base.html. -#}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:24px;background:#f5f5f4;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1c1917;line-height:1.5">
<main style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:24px">
<p style="margin-top:0;font-weight:600">{{ site_name }}</p>
{% block content %}{% endblock %}
</main>
<p style="max-width:560px;margin:16px auto 0;font-size:13px;color:#57534e">{% block footer %}Sent by {{ site_name }}{% if site_url %} · <a href="{{ site_url }}" style="color:#57534e">{{ site_url }}</a>{% endif %}{% endblock %}</p>
</body>
</html>
