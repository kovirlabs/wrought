label = "Password reset"
version = "1.0.0"
group = "accounts"
features = ["auth"]
description = "Ask for a password reset link by email."
reads = ["user", "csrf", "request"]

[[args]]
name = "title"
type = "text"
default = "Reset your password"

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "reset"

[example]
level = 3
