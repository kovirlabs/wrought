label = "Register"
version = "1.0.0"
group = "accounts"
features = ["auth"]
description = "Create an account (when [auth] registration = open), with a honeypot."
reads = ["user", "csrf", "request"]

[[args]]
name = "next"
type = "url"

[[args]]
name = "title"
type = "text"
default = "Create an account"

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "register"

[example]
level = 3
