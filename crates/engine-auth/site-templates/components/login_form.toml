label = "Login"
version = "1.0.0"
group = "accounts"
features = ["auth"]
description = "Email and password, posting to /account/login/; a link on pages not rendered per request."
reads = ["user", "csrf", "request"]

[[args]]
name = "next"
type = "url"

[[args]]
name = "title"
type = "text"
default = "Sign in"

[[args]]
name = "level"
type = "integer"
default = 2

[editor]
icon = "login"

[example]
title = "Sign in"
level = 3
