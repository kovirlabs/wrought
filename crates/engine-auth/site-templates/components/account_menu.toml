label = "Account menu"
version = "1.0.0"
group = "accounts"
features = ["auth"]
description = "The visitor name with Profile, Admin and Sign out in a <details> menu; or sign-in links."
reads = ["user", "csrf", "request"]

[[args]]
name = "links"
type = "list"
help = "Extra [{label, url}] for signed-in visitors."

[[args]]
name = "label"
type = "text"
default = "Account"

[editor]
icon = "account"
hidden = true

[example]
label = "Account"
