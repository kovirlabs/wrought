{% extends "engine/base.html" %}
{% block main %}
<h1>Reset your password</h1>
{% if sent %}
<p role="status">If an account exists for that address, a link to choose a new password is on its way. It works once, for one hour.</p>
<p><a href="/account/login/">Back to sign in</a></p>
{% else %}
<form method="post" action="/account/reset/">
<input type="hidden" name="_csrf" value="{{ csrf }}">
<p>
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="username" required>
</p>
<p><button type="submit">Send a reset link</button></p>
</form>
<p><a href="/account/login/">Back to sign in</a></p>
{% endif %}
{% endblock %}
