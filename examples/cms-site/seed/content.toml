[[article]]
title = "Flattening a plane sole"
status = "published"
author = "ada"
cover = 2
topics = ["Hand tools", "Sharpening"]
summary = "Lapping a sole flat on sandpaper and glass."
body = """
A plane only cuts as true as its sole. Start with coarse paper on a flat
reference, mark the sole with a marker, and work until the ink is gone.

## What you need

- float glass or a granite plate
- 80, 120 and 220 grit paper
- patience
"""
sections = [
  { type = "callout", title = "Safety", text = "Wear a mask: the dust is **metal**.", tone = "warning" },
  { type = "panel", title = "Keep going", text = "Flat is a habit, not a moment: check the sole **every** month.", background = "surface", padding = "md" },
]

[[article]]
title = "Why wrought iron lasts"
status = "published"
author = "ada"
# Media #1 (`engine media add ... media-samples/harbour-at-dusk.jpg`).
cover = 1
topics = ["Materials"]
summary = "Slag fibres, corrosion and centuries-old railings."
body = """
Wrought iron carries threads of slag through the metal. They make it tough,
weldable in the forge, and slow to rust through.
"""
sections = [
  { type = "quote", text = "Iron, worked by hand, *remembers* the hand.", cite = "A blacksmith" },
]

[[article]]
title = "A drawbored mortise and tenon"
status = "published"
author = "bo"
topics = ["Joinery", "Hand tools"]
summary = "Pulling a joint tight with an offset peg."
body = """
Drill the mortise cheeks, assemble, mark the hole on the tenon, then drill
it a millimetre closer to the shoulder. The peg pulls the joint home.
"""

