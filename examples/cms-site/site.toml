# A small CMS-driven site: articles, authors, topics and site settings live
# in PostgreSQL (types/*.toml), and pages are published to public/ whenever
# content changes. The About page is Markdown, also in publish mode; the
# colophon is a `build` route that only `engine build` writes.
#
# The database URL comes from ENGINE_DATABASE_URL (keep credentials out of
# this file), or from `[database] url`.
#
# Editors work in the admin at /admin/ (create the first administrator with
# `engine user create`); /account/ is a page only signed-in people see.
[site]
name = "CMS Site"
base_url = "https://cms.example.org"
description = "Notes from the workshop, published from a database."
author = "The Workshop"
language = "en"
output = "public"
nav = [
  { label = "Articles", url = "/articles/" },
  { label = "Topics", url = "/topics/" },
  { label = "About", url = "/about/" },
]

[site.extra]
favicon = "/favicon.svg"

[database]
max_connections = 5

[render]
default = "publish"

[publish]
target = "disk"

# A paginated list: /articles/, /articles/page/2/, ... A new article adds a
# page when needed; templates get `listing` (items, pagination).
[[routes]]
path = "/articles/"
template = "articles.html"
title = "Articles"
description = "Everything published so far."

[routes.list]
type = "article"
per_page = 5

[[routes]]
path = "/articles/{slug}/"
type = "article"
template = "article.html"

[[routes]]
path = "/authors/{slug}/"
type = "author"
template = "author.html"

[[routes]]
path = "/topics/"
template = "topics.html"
title = "Topics"

[[routes]]
path = "/topics/{term}/"
taxonomy = "topics"
template = "topic.html"

[[routes]]
path = "/colophon/"
template = "colophon.html"
mode = "build"
title = "Colophon"

# Rendered for each request, only for signed-in people (others are sent to
# the sign-in page). Never written to public/.
[[routes]]
path = "/account/"
template = "account.html"
mode = "request"
requires = "auth"
title = "Your account"

# Accounts (all optional; these are the defaults).
[auth]
session_hours = 12
idle_minutes = 120
require_totp_for_admins = false

[ui]
css = "tagbrush"
behaviour = "tagaction"

[ui.tokens]
primary = "#0f766e"
font_heading = "Georgia, 'Times New Roman', serif"
