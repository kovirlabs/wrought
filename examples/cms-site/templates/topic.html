{% extends "base.html" %}
{% block main %}
<nav aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><a href="/topics/">Topics</a></li><li><a href="{{ page.url }}" aria-current="page">{{ page.name }}</a></li></ol></nav>
<h1>{{ page.name }}</h1>
<ul>
{% for a in list_items("article", term=page.slug) %}
<li><a href="{{ a.url }}">{{ a.title }}</a></li>
{% endfor %}
</ul>
{% endblock %}
