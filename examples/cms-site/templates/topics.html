{% extends "base.html" %}
{% block main %}
{{ component("breadcrumbs") }}
<h1>{{ page.title }}</h1>
<ul>
{% for t in list_terms("topics") %}
<li><a href="{{ t.url }}">{{ t.name }}</a> ({{ list_items("article", term=t.slug) | length }})</li>
{% else %}
<li>No topics yet.</li>
{% endfor %}
</ul>
{% endblock %}
