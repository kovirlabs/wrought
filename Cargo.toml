[workspace]
resolver = "3"
members = [
    "crates/engine-core",
    "crates/engine-db",
    "crates/engine-content",
    "crates/engine-publish",
    "crates/engine-auth",
    "crates/engine-admin",
    "crates/engine-jobs",
    "crates/engine-mail",
    "crates/engine-forms",
    "crates/engine-media",
    "crates/engine-search",
    "crates/engine-api",
    "crates/engine-s3",
    "crates/engine-payments",
    "crates/engine-cli",
]
# A plain `cargo build` / `cargo test` builds the default (static) engine and
# compiles no database code. `--workspace --all-features` builds everything.
default-members = ["crates/engine-core", "crates/engine-cli"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"
repository = "https://github.com/kovirlabs/hammerwright"

[workspace.dependencies]
engine-core = { path = "crates/engine-core", version = "0.7.0", default-features = false }
engine-db = { path = "crates/engine-db", version = "0.7.0", default-features = false }
engine-content = { path = "crates/engine-content", version = "0.7.0", default-features = false }
engine-publish = { path = "crates/engine-publish", version = "0.7.0", default-features = false }
engine-auth = { path = "crates/engine-auth", version = "0.7.0", default-features = false }
engine-admin = { path = "crates/engine-admin", version = "0.7.0", default-features = false }
engine-jobs = { path = "crates/engine-jobs", version = "0.7.0", default-features = false }
engine-mail = { path = "crates/engine-mail", version = "0.7.0", default-features = false }
engine-forms = { path = "crates/engine-forms", version = "0.7.0", default-features = false }
engine-media = { path = "crates/engine-media", version = "0.7.0", default-features = false }
engine-search = { path = "crates/engine-search", version = "0.7.0", default-features = false }
engine-api = { path = "crates/engine-api", version = "0.7.0", default-features = false }
engine-s3 = { path = "crates/engine-s3", version = "0.7.0", default-features = false }
engine-payments = { path = "crates/engine-payments", version = "0.7.0", default-features = false }
ammonia = "4"
sha2 = "0.10"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "derive", "json"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
minijinja = { version = "2", features = ["loader", "urlencode"] }
notify = { version = "8", default-features = false }
percent-encoding = "2"
# HTTP client for the S3 target, OIDC and payment providers (rustls with ring,
# webpki roots; no OpenSSL, no aws-lc).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Snowball stemmers for search snippets cut in the engine (engine-search).
rust-stemmers = "1.2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Image decoding, resizing and encoding (the `media` feature) are optimised
# even in debug and test builds: unoptimised, one small JPEG upload with its
# five variants took 11 s, and the end-to-end tests' uploads ran past their
# 30-second request timeout whenever the machine was busy.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.pxfm]
opt-level = 3
[profile.dev.package.engine-media]
opt-level = 3
