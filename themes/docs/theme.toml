label = "Documentation"
description = "A documentation site: landing page, sidebar navigation, table of contents, previous/next links."
presets = ["static", "cms", "app"]
nav = [ { label = "Docs", url = "/docs/" } ]

[tokens]
# [light, dark] pairs keep links and buttons readable in both colour schemes.
primary = ["#1d4ed8", "#93c5fd"]
link = ["#1d4ed8", "#93c5fd"]
on_primary = ["#ffffff", "#0b1020"]
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
font_heading = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
font_mono = "ui-monospace, 'SFMono-Regular', Menlo, monospace"
reading_width = "46rem"
radius = "0.375rem"
