# Caddy in front of `engine serve` for a site with publish routes:
# files that exist are served by Caddy, misses go to the engine.
#
#   engine build --site examples/cms-site
#   engine serve --site examples/cms-site            # 127.0.0.1:4400
#   docker compose -f deploy/compose.publish.yml up -d
#   curl -I http://127.0.0.1:8791/articles/
#   docker compose -f deploy/compose.publish.yml down
#
# The site folder (not its output folder) is mounted, so `engine build`
# replacing the output folder does not leave Caddy on a stale mount.
# Caddy uses the host network to reach the engine on 127.0.0.1 and binds
# 127.0.0.1 only (see Caddyfile.publish).
name: wrought-publish

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: wrought-caddy-publish
    restart: "no"
    network_mode: host
    environment:
      WROUGHT_PORT: ${WROUGHT_PORT:-8791}
      OUTPUT: ${OUTPUT:-public}
      ENGINE_UPSTREAM: ${ENGINE_UPSTREAM:-127.0.0.1:4400}
    volumes:
      - ./Caddyfile.publish:/etc/caddy/Caddyfile:ro
      - ${SITE:-../examples/cms-site}:/srv/site:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    # The caddy binary carries this file capability; exec fails without it.
    cap_add: [NET_BIND_SERVICE]
