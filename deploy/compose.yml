# Serve a built Wrought site through Caddy, the production front-door model.
#
#   engine build --site docs
#   docker compose -f deploy/compose.yml up -d
#   curl -I http://127.0.0.1:8790/docs/
#   docker compose -f deploy/compose.yml down
#
# SITE_DIR picks another output folder (relative to this file), e.g.
#   SITE_DIR=../examples/static-blog/public docker compose -f deploy/compose.yml up -d
name: wrought-test-deploy

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: wrought-test-caddy
    restart: "no"
    ports:
      - "127.0.0.1:${WROUGHT_PORT:-8790}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SITE_DIR:-../docs/public}:/srv/site:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
