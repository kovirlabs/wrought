# PostgreSQL for developing and testing Wrought's database features. LOCAL
# DEVELOPMENT ONLY: the credentials below are public and the port is bound
# to localhost.
#
#   docker compose -f deploy/compose.postgres.yml up -d --wait
#   export DATABASE_URL=postgres://wrought:wrought@127.0.0.1:55432/wrought
#   docker compose -f deploy/compose.postgres.yml down -v   # also deletes data
#
# Port 55432 avoids a system Postgres on 5432. Override with WROUGHT_PG_PORT.
#
# Test-suite settings (see DECISIONS.md, v0.4 "flaky database tests"):
# * the health check connects over TCP: on a fresh volume the image first
#   runs a temporary server for initdb that listens only on the Unix socket
#   and then restarts, so a socket check reported "healthy" before the real
#   server was up;
# * max_connections 300 and 256 MB of /dev/shm give the parallel test suite
#   (many throwaway databases, `engine serve` child processes, job workers)
#   headroom; Docker's default 64 MB /dev/shm is too small for Postgres'
#   dynamic shared memory under load.
name: wrought-postgres

services:
  postgres:
    image: postgres:17
    container_name: wrought-postgres
    restart: "no"
    command: ["postgres", "-c", "max_connections=300"]
    shm_size: 256mb
    environment:
      POSTGRES_USER: wrought
      POSTGRES_PASSWORD: wrought
      POSTGRES_DB: wrought
    ports:
      - "127.0.0.1:${WROUGHT_PG_PORT:-55432}:5432"
    volumes:
      - wrought-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=wrought psql -h 127.0.0.1 -U wrought -d wrought -Atc 'SELECT 1' >/dev/null"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 30s

volumes:
  wrought-pgdata:
    name: wrought-pgdata
