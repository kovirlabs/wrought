# PostgreSQL for developing and testing Wrought's `db-postgres`, `content`
# and `publish` features. LOCAL DEVELOPMENT ONLY: the credentials below are
# public and the port is bound to localhost.
#
#   docker compose -f deploy/compose.postgres.yml up -d --wait
#   export DATABASE_URL=postgres://wrought:wrought@127.0.0.1:55432/wrought
#   docker compose -f deploy/compose.postgres.yml down -v   # also deletes data
#
# Port 55432 avoids a system Postgres on 5432. Override with WROUGHT_PG_PORT.
name: wrought-postgres

services:
  postgres:
    image: postgres:17
    container_name: wrought-postgres
    restart: "no"
    environment:
      POSTGRES_USER: wrought
      POSTGRES_PASSWORD: wrought
      POSTGRES_DB: wrought
    ports:
      - "127.0.0.1:${WROUGHT_PG_PORT:-55432}:5432"
    volumes:
      - wrought-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrought -d wrought"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  wrought-pgdata:
    name: wrought-pgdata
