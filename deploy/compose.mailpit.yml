# Mailpit: a local SMTP sink for developing and testing Wrought's `mail`
# feature. It accepts every message and relays none; read them in the web UI
# or through its API. LOCAL DEVELOPMENT ONLY.
#
#   docker compose -f deploy/compose.mailpit.yml up -d --wait
#   export ENGINE_SMTP_URL=smtp://127.0.0.1:51025
#   open http://127.0.0.1:58025/            # web UI
#   curl http://127.0.0.1:58025/api/v1/messages
#   docker compose -f deploy/compose.mailpit.yml down
#
# Ports avoid the usual 1025/8025. Override with WROUGHT_SMTP_PORT and
# WROUGHT_MAILPIT_PORT.
name: wrought-mailpit

services:
  mailpit:
    image: axllent/mailpit:v1.27.0
    container_name: wrought-mailpit
    restart: "no"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${WROUGHT_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${WROUGHT_MAILPIT_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 3s
      retries: 30
