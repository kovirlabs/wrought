# Caddy in front of `engine serve` for the `app` example (small-app): files
# that exist are served by Caddy; request pages, form posts, the admin,
# signed-in visitors and misses go to the engine (Caddyfile.publish).
#
#   engine build --site examples/small-app
#   engine serve --site examples/small-app            # 127.0.0.1:4400
#   docker compose -f deploy/compose.app.yml up -d
#   curl -I http://127.0.0.1:8792/                    # a file, from Caddy
#   curl -I http://127.0.0.1:8792/support/            # a request page, from the engine
#   docker compose -f deploy/compose.app.yml down
#
# Same Caddyfile as the publishing example, another port and site.
name: wrought-test-app

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: wrought-test-caddy-app
    restart: "no"
    network_mode: host
    environment:
      WROUGHT_PORT: ${WROUGHT_PORT:-8792}
      OUTPUT: ${OUTPUT:-public}
      ENGINE_UPSTREAM: ${ENGINE_UPSTREAM:-127.0.0.1:4400}
    volumes:
      - ./Caddyfile.publish:/etc/caddy/Caddyfile:ro
      - ${SITE:-../examples/small-app}:/srv/site:ro
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
