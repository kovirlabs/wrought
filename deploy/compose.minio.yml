# MinIO: a local S3-compatible bucket server for developing and testing
# Wrought's `s3` publish target and media on S3. LOCAL DEVELOPMENT ONLY: the
# credentials below are public test values and the data lives in memory
# (tmpfs), so it is gone when the container stops.
#
#   docker compose -f deploy/compose.minio.yml up -d --wait
#   export AWS_ACCESS_KEY_ID=wrought-test AWS_SECRET_ACCESS_KEY=wrought-test-secret
#   # site.toml: [publish] target = "s3", endpoint = "http://127.0.0.1:59000",
#   #            bucket = "...", region = "us-east-1"
#   open http://127.0.0.1:59001/            # web console
#   docker compose -f deploy/compose.minio.yml down -v
#
# The image is the community build of MinIO maintained by Pigsty
# (`pgsty/minio`), pinned: MinIO Inc. no longer publishes images.
# Ports avoid the usual 9000/9001. Override with WROUGHT_MINIO_PORT and
# WROUGHT_MINIO_CONSOLE_PORT.
name: wrought-test-minio

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: wrought-test-minio
    restart: "no"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: wrought-test
      MINIO_ROOT_PASSWORD: wrought-test-secret
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${WROUGHT_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${WROUGHT_MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
