# Shared setup for the CI jobs: the Rust toolchain pinned in
# rust-toolchain.toml (installed with rustup, which is itself installed when
# the job image has none) and a cache of the cargo registry and the job's
# target folder. Local builds read the same file, so clippy and rustfmt
# give the same answer here and on a developer's machine.
#
# It only uses `run` steps and actions/cache, so it needs nothing from the
# runner image beyond a shell and curl.
name: Rust toolchain and cache
description: Install the pinned Rust toolchain (rust-toolchain.toml) and restore the cargo cache.
inputs:
  cache-key:
    description: Name of the cache (one per job, as each job builds different features).
    default: ""
  cache:
    description: >-
      "true" to restore and save the registry and target cache. Release builds
      pass "false": a cache written by another ref must never feed signed
      artefacts.
    default: "true"
  components:
    description: Extra rustup components (comma separated, e.g. "rustfmt,clippy").
    default: ""
runs:
  using: composite
  steps:
    - name: Install Rust
      shell: bash
      run: |
        set -eu
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
        fi
        # The pinned version; its clippy and rustfmt components come with it.
        TC=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        test -n "$TC"
        rustup toolchain install "$TC" --profile minimal --component clippy,rustfmt ${{ inputs.components != '' && format('--component {0}', inputs.components) || '' }}
        rustc --version
    - name: Cache cargo registry and target
      if: inputs.cache == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ inputs.cache-key }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ inputs.cache-key }}-${{ runner.os }}-
