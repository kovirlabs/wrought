# CI jobs that need Docker on the runner's host: the PostgreSQL suite (with
# Mailpit and the other test services: MinIO, the OIDC provider) and the
# statement catalogue on both backends. The test scripts start containers
# with `docker compose` and reach them on 127.0.0.1, so these jobs
# need a runner with Docker and the compose plugin on the host; GitHub's
# hosted ubuntu-latest machines qualify.
#
# NO pull_request or pull_request_target trigger, on purpose: such a runner
# runs code with the host's Docker socket, so it only ever runs code that is
# already on the protected default branch (or a manual run by someone with
# write access). Fork pull requests get ci.yml, which runs on sandboxed
# runners only. Keep it that way; see CONTRIBUTING.md ("CI runners") for the
# runner settings the owner must make outside the repository.
#
# Runner label (repository variable, not a secret):
#   WROUGHT_DOCKER_RUNNER  default ubuntu-latest. Never the release runner.
#                          The test containers have fixed names and ports,
#                          so give the runner a capacity of 1. Containers
#                          are left running after the job (the scripts
#                          reuse them; GitHub's machines are thrown away).
name: host

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

concurrency:
  group: host-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-postgres:
    name: tests on PostgreSQL (with Mailpit and the other test services)
    runs-on: ${{ vars.WROUGHT_DOCKER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-test-all
      - name: Check Docker
        run: docker version && docker compose version
      # Starts wrought-test-postgres, wrought-test-mailpit and whatever other
      # containers the suite needs (deploy/compose.*.yml), then runs every
      # crate with every feature.
      - run: scripts/test-postgres.sh
      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -a --filter name=wrought-test- --format '{{.Names}}'); do
            echo "== $c"; docker logs --tail 100 "$c" || true
          done

  # Idle memory of the `cms` preset on PostgreSQL must stay under the
  # recorded budget (scripts/check-memory.sh; DECISIONS.md).
  memory-budget:
    name: idle memory budget (cms preset, PostgreSQL)
    runs-on: ${{ vars.WROUGHT_DOCKER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-memory
      - run: scripts/check-memory.sh

  # Requests a second of a published file, a page rendered per request and
  # search (cms preset, PostgreSQL, release build, the engine on one CPU)
  # must stay above recorded floors (scripts/check-speed.sh; DECISIONS.md,
  # "Speed guard"). The floors were measured on the benchmark machine; a
  # slower runner can set its own with the repository variables below.
  speed:
    name: speed guard (cms preset, PostgreSQL)
    runs-on: ${{ vars.WROUGHT_DOCKER_RUNNER || 'ubuntu-latest' }}
    env:
      WROUGHT_SPEED_FLOOR_FILE: ${{ vars.WROUGHT_SPEED_FLOOR_FILE }}
      WROUGHT_SPEED_FLOOR_RENDER: ${{ vars.WROUGHT_SPEED_FLOOR_RENDER }}
      WROUGHT_SPEED_FLOOR_SEARCH: ${{ vars.WROUGHT_SPEED_FLOOR_SEARCH }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-memory
      - run: scripts/check-speed.sh

  queries:
    name: statement catalogue (SQLite and PostgreSQL)
    needs: test-postgres
    runs-on: ${{ vars.WROUGHT_DOCKER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: host-test-all
      - run: scripts/check-queries.sh
