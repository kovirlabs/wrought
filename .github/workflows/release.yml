# Signed release binaries, built when a version tag (v0.6.0, ...) is pushed.
# See ci.yml for the layout.
#
# What it does: builds the `engine` binary for the static, cms and app
# presets on x86_64 and aarch64 Linux (scripts/release.sh), writes SHA-256
# checksums, signs every archive and the checksum file with the release SSH
# key, verifies the result, and keeps it as a workflow artifact. It only
# attaches the files to a release when the repository variable
# WROUGHT_PUBLISH_RELEASE is "true": a *draft* release to review and publish
# by hand.
#
# Needs:
#   secret   RELEASE_SIGNING_KEY  the private release key (OpenSSH format,
#                                 ed25519); never committed anywhere
#   file     release/allowed_signers  lists the matching public key
#   variable WROUGHT_RELEASE_RUNNER   optional runner label (default
#                                     ubuntu-22.04: an older glibc, so the
#                                     binaries run on more systems)
# The key comes from a secret rather than keyless (sigstore) signing, so
# verification needs only OpenSSH; see DECISIONS.md.
name: release

# Only tag pushes, never workflow_dispatch: a manual run on a branch would
# get the signing key. Protect the `v*` tags (only maintainers may push
# them) and keep RELEASE_SIGNING_KEY in the `release` environment (required
# reviewers, deployments limited to `v*` tags).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build, checksum, sign
    if: github.ref_type == 'tag'
    environment: release
    # Never the host-mode runner used for the test containers: release
    # builds run on a clean, ephemeral machine (docs: releases).
    runs-on: ${{ vars.WROUGHT_RELEASE_RUNNER || 'ubuntu-22.04' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No build or registry cache: signed artefacts start from a clean
      # target folder and the lock file (scripts/release.sh builds --locked).
      - uses: ./.github/actions/rust
        with:
          cache: "false"
      - name: Start from a clean target folder
        run: rm -rf target dist
      - name: Install the aarch64 cross compiler
        run: |
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq gcc-aarch64-linux-gnu
      - name: Build and sign
        env:
          WROUGHT_SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.RELEASE_SIGNING_KEY || '' }}
          WROUGHT_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          WROUGHT_RELEASE_TARGETS: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
        run: scripts/release.sh --presets "static cms app"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  publish-github:
    name: draft GitHub release
    needs: build
    if: vars.WROUGHT_PUBLISH_RELEASE == 'true' && github.ref_type == 'tag' && github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Create a draft release with the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "$TAG" dist/*
