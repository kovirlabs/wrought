# Continuous integration for Wrought: the jobs that run for every pull
# request, including pull requests from forks.
#
# Every job calls the same scripts a developer runs locally (README
# "Development"); the workflows add no test logic of their own.
#
# Security split: this workflow runs untrusted code (fork pull requests), so
# every job here runs on the fixed label `ubuntu-latest`, meant to be a
# sandboxed, ephemeral runner (GitHub's hosted machines, or a self-hosted
# runner that starts a fresh container per job and has no Docker socket).
# The PostgreSQL suite and the statement catalogue use a `services:
# postgres` container, which the runner starts beside the job. Jobs that
# need Docker on the host's loopback (the suite with Mailpit and the other
# test services, the timing and memory checks) are in host.yml, which has
# no pull-request trigger. A workflow file in a
# pull request can be edited by its author, so the real protection is the
# runner configuration outside the repository; CONTRIBUTING.md ("CI
# runners") lists what the owner must set up.
#
# No secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
  # Pinned so a new release of a checker cannot turn CI red on its own.
  CARGO_AUDIT_VERSION: "0.23.0"
  CARGO_DENY_VERSION: "0.22.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: fmt
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: clippy
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-default:
    name: cargo test (static, no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: test-default
      - run: cargo test

  # The whole suite on PostgreSQL, against a service container the runner
  # starts next to the job (no Docker socket for the job itself). The mail,
  # bucket and sign-in tests need more services; host.yml runs them.
  test-postgres:
    name: tests on PostgreSQL (service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wrought
          POSTGRES_PASSWORD: wrought
          POSTGRES_DB: wrought
        ports:
          - 5432:5432
        # Docker's default 64 MB of /dev/shm is too small for PostgreSQL's
        # dynamic shared memory under the parallel suite.
        options: >-
          --shm-size=256mb
          --health-cmd "pg_isready -h 127.0.0.1 -U wrought"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: test-all
      # The service keeps PostgreSQL's default of 100 connections (a service
      # container takes no command line), so fewer test databases at once.
      - run: scripts/test-postgres.sh
        env:
          WROUGHT_PG_URL: postgres://wrought:wrought@127.0.0.1:5432/wrought
          ENGINE_TEST_DB_CONCURRENCY: "4"

  queries:
    name: statement catalogue (service container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wrought
          POSTGRES_PASSWORD: wrought
          POSTGRES_DB: wrought
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wrought"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: test-all
      - run: scripts/check-queries.sh
        env:
          WROUGHT_PG_URL: postgres://wrought:wrought@127.0.0.1:5432/wrought

  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: features
      - run: scripts/check-features.sh

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: audit
      - name: Cache checker binaries
        uses: actions/cache@v5
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-audit-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: |
          if [ ! -x ~/.cargo-tools/bin/cargo-audit ]; then
            cargo install --locked --root ~/.cargo-tools cargo-audit --version "$CARGO_AUDIT_VERSION"
          fi
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      # Reads .cargo/audit.toml for the (documented) exceptions.
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: deny
      - name: Cache checker binaries
        uses: actions/cache@v5
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          if [ ! -x ~/.cargo-tools/bin/cargo-deny ]; then
            cargo install --locked --root ~/.cargo-tools cargo-deny --version "$CARGO_DENY_VERSION"
          fi
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - run: cargo deny --all-features check

  # scripts/check-a11y.sh needs Node.js and a PostgreSQL (the service
  # container below, through WROUGHT_PG_URL), but no Docker of its own. If
  # it ever starts containers, move this job to host.yml.
  a11y:
    name: accessibility (TagCheck and axe-core)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wrought
          POSTGRES_PASSWORD: wrought
          POSTGRES_DB: wrought
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wrought"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: a11y
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/check-a11y.sh') }}
          restore-keys: npm-${{ runner.os }}-
      # Builds the examples, the docs gallery and the admin pages and checks
      # them with TagCheck (WCAG checks) and axe-core (second opinion).
      # Database sites use throwaway databases on the service container.
      - run: scripts/check-a11y.sh
        env:
          WROUGHT_PG_URL: postgres://wrought:wrought@127.0.0.1:5432/wrought
      # The visual editor driven in the same headless browser.
      - run: scripts/check-editor.sh
        env:
          WROUGHT_PG_URL: postgres://wrought:wrought@127.0.0.1:5432/wrought

  # Browser caching end to end (scripts/check-caching.sh; DECISIONS.md,
  # "Browser caching"): after an edit one refresh shows it, unchanged pages
  # are 304s and content-hashed files come from the browser's cache. Here
  # through `engine serve` only (no Docker in ci.yml beyond the PostgreSQL
  # service container); host.yml runs it through Caddy too.
  caching:
    name: browser caching (engine serve)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wrought
          POSTGRES_PASSWORD: wrought
          POSTGRES_DB: wrought
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U wrought"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: a11y
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/check-a11y.sh') }}
          restore-keys: npm-${{ runner.os }}-
      - run: scripts/check-a11y.sh
        env:
          WROUGHT_A11Y_INSTALL_ONLY: "1"
      - run: scripts/check-caching.sh
        env:
          WROUGHT_CACHING_NO_CADDY: "1"
          WROUGHT_PG_URL: postgres://wrought:wrought@127.0.0.1:5432/wrought

  # The committed editor bundle must be the build of editor/ (pinned,
  # locked packages): rebuilt and compared. Building the engine itself
  # never needs Node; the "no node" job proves it.
  editor-bundle:
    name: visual editor bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: scripts/build-editor.sh --check

  no-node:
    name: engine builds without Node.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          cache-key: no-node
      # A PATH with every tool except Node and npm (some runners keep node
      # next to the system tools, so the folders are rebuilt as symlinks).
      - run: |
          mkdir -p "$RUNNER_TEMP/nonode"
          for d in $(printf '%s' "$PATH" | tr ':' ' '); do
            for f in "$d"/*; do
              n=$(basename "$f")
              case "$n" in node|nodejs|npm|npx|corepack) continue ;; esac
              [ -e "$RUNNER_TEMP/nonode/$n" ] || ln -s "$f" "$RUNNER_TEMP/nonode/$n" 2>/dev/null || true
            done
          done
          export PATH="$RUNNER_TEMP/nonode"
          ! command -v node
          cargo build --locked -p engine-cli --features cms
