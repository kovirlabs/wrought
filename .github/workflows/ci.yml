# Continuous integration for Wrought.
#
# One file for Forgejo Actions (the internal Forgejo and Codeberg) and GitHub
# Actions (the mirror). It lives in .github/workflows/ because GitHub reads
# only that folder and Forgejo reads it whenever the repository has no
# .forgejo/workflows/ folder (so do not add one, or Forgejo stops reading
# this file). Every job calls the same scripts a developer runs locally
# (README "Development"); the workflow adds no test logic of its own.
#
# Runners (set as repository or organisation *variables*, not secrets):
#   WROUGHT_RUNNER         label for ordinary jobs (default: ubuntu-latest).
#                          A Forgejo runner label with a Debian/Ubuntu image
#                          and network access; Rust is installed on the fly.
#   WROUGHT_DOCKER_RUNNER  label for jobs that start containers (Postgres,
#                          Mailpit, MinIO, the OIDC provider) with
#                          `docker compose` and reach them on 127.0.0.1
#                          (default: ubuntu-latest). On Forgejo this must be
#                          a runner whose jobs run on the host (a `:host`
#                          label) with Docker and the compose plugin, since
#                          the test scripts publish container ports on the
#                          host's loopback. GitHub's ubuntu-latest qualifies.
#                          The test containers have fixed names and ports, so
#                          give that runner a capacity of 1. They are left
#                          running after the job (the scripts reuse running
#                          containers; GitHub's machines are thrown away).
# Codeberg's hosted runners (codeberg-tiny/small/medium) cap jobs at 2 to 10
# minutes and have no Docker daemon, which is too little for this workspace;
# on Codeberg, register an own runner (see CONTRIBUTING.md).
#
# No secrets are used: pull requests from forks run the same jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
  # Pinned so a new release of a checker cannot turn CI red on its own.
  CARGO_AUDIT_VERSION: "0.23.0"
  CARGO_DENY_VERSION: "0.22.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: fmt
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy (all features)
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: clippy
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-default:
    name: cargo test (static, no database)
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: test-default
      - run: cargo test

  test-sqlite:
    name: tests on SQLite
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: test-all
      - run: scripts/test-sqlite.sh

  test-postgres:
    name: tests on PostgreSQL (with Mailpit and the other test services)
    runs-on: ${{ vars.WROUGHT_DOCKER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: test-all
      - name: Check Docker
        run: docker version && docker compose version
      # Starts wrought-test-postgres, wrought-test-mailpit and whatever other
      # containers the suite needs (deploy/compose.*.yml), then runs every
      # crate with every feature.
      - run: scripts/test-postgres.sh
      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -a --filter name=wrought-test- --format '{{.Names}}'); do
            echo "== $c"; docker logs --tail 100 "$c" || true
          done

  queries:
    name: statement catalogue (SQLite and PostgreSQL)
    runs-on: ${{ vars.WROUGHT_DOCKER_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: test-all
      - run: scripts/check-queries.sh

  features:
    name: feature combinations
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: features
      - run: scripts/check-features.sh

  audit:
    name: cargo audit
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: audit
      - name: Cache checker binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-audit-${{ env.CARGO_AUDIT_VERSION }}
      - name: Install cargo-audit
        run: |
          if [ ! -x ~/.cargo-tools/bin/cargo-audit ]; then
            cargo install --locked --root ~/.cargo-tools cargo-audit --version "$CARGO_AUDIT_VERSION"
          fi
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      # Reads .cargo/audit.toml for the (documented) exceptions.
      - run: cargo audit --deny warnings

  deny:
    name: cargo deny
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: deny
      - name: Cache checker binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: cargo-tools-${{ runner.os }}-deny-${{ env.CARGO_DENY_VERSION }}
      - name: Install cargo-deny
        run: |
          if [ ! -x ~/.cargo-tools/bin/cargo-deny ]; then
            cargo install --locked --root ~/.cargo-tools cargo-deny --version "$CARGO_DENY_VERSION"
          fi
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"
      - run: cargo deny --all-features check

  a11y:
    name: accessibility (TagCheck and axe-core)
    runs-on: ${{ vars.WROUGHT_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust
        with:
          cache-key: a11y
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('scripts/check-a11y.sh') }}
          restore-keys: npm-${{ runner.os }}-
      # Builds the examples, the docs gallery and the admin pages and checks
      # them with TagCheck (WCAG checks) and axe-core (second opinion).
      - run: scripts/check-a11y.sh
